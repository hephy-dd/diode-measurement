[build-system]
requires = ["uv_build>=0.12.9,<0.13"]
build-backend = "uv_build"

[project]
name = "diode-measurement"
version = "0.31.2"
description = "IV/CV measurements for silicon sensors."
readme = "README.md"
license = {text = "GPLv3"}
keywords = []
authors = [
    {name = "Bernhard Arnold", email = "bernhard.arnold@oeaw.ac.at"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
    "Topic :: System :: Hardware",
]
requires-python = ">=3.11"
dependencies = [
    "comet",
    "PySide6~=6.11.1",
    "PyVISA~=1.16.1",
    "PyVISA-py~=0.8.1",
    "json-rpc~=1.15",
]

[project.urls]
Homepage = "https://github.com/hephy-dd/diode-measurement/"
Source = "https://github.com/hephy-dd/diode-measurement/"

[project.scripts]
diode-measurement = "diode_measurement.__main__:main"

[tool.uv.sources]
comet = { git = "https://github.com/hephy-dd/comet.git", tag = "v1.6.0" }

[tool.ruff.lint]
extend-ignore = ["BLE001", "RUF022"]

[tool.pyright]
typeCheckingMode = "standard"
